[[sections]]
title = "关于课堂小测"

[[sections.items]]
content = "这门课成绩100%课堂小测，老师将课堂小测作为考勤以及打分的唯一依据。几乎每节课都会有小测，大概会是3-5道题（选择/问答/计算……），每次老师会发一张大小不一样的小卡片，需要在卡片上写。老师的小测在ppt上都可以找到，允许做的时候参考ai和ppt，也就是开卷小测，给分也比较松。这门课非常容易拿到高分，在课上也可以学到很多有用的内容（和软件构造java这门课配合在一起上很有互相补充互相验证的感觉）。"
